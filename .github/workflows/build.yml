# Builds index.html and the CV PDFs from content/*.json on every push to main,
# then publishes the result to GitHub Pages.
#
# One-time setup on GitHub: Settings -> Pages -> Source: "GitHub Actions".

name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          pip install jinja2 playwright pymupdf
          python -m playwright install --with-deps chromium

      - name: Build page and CVs
        run: python build.py --cv

      - name: Collect the site
        run: |
          mkdir -p _site/assets
          cp index.html site.css _site/
          cp assets/* _site/assets/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
